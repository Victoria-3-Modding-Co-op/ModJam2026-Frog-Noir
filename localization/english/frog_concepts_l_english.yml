l_english:

 concept_frog_conspiracy: "Conspiracy"
 concept_frog_conspiracy_desc: "A new menace has appeared in the world of the humans. A conspiracy reaching every aspect of human life. The $frog_toads_concept$ have started to infiltrate positions of power. And only the $concept_frog_frogs$ can stop them!\n\nSend out your $frog_private_investigators$ to $frog_investigate_concept$, $frog_follow_leads_concept$ and $frog_keep_watch_concept$ and end the menace once and for all!"
 concept_frog_the_conspiracy: "The Conspiracy"
 frog_the_conspiracy: "[Concept('concept_frog_conspiracy', '$concept_frog_the_conspiracy$')]"

 concept_frog_frog: "Frog"
 concept_frog_frog_desc: "For centuries the Frogs were hidden from the world of the humans. Waiting for the right time to appear.\n\nThey used the time to sharpen their senses, to deduct, investigate and keep track of their mortal enemies, the $frog_toads_concept$. And after all this time the Toads finally came out of hiding to start $frog_the_conspiracy$. The Conspiracy to take over the world of the humans.\n\nIt is Showtime! The Frogs send out their $frog_private_investigators$ to $frog_investigate_concept$, $frog_follow_leads_concept$ and $frog_keep_watch_concept$.\n\nIt's time to croak some crooks!"
 concept_frog_frogs: "Frogs"
 frog_frogs_concept: "[Concept('concept_frog_frog', '$concept_frog_frogs$')]"
 concept_frog_frogman: "Frogman"
 frog_frogman_concept: "[Concept('concept_frog_frog', '$concept_frog_frogman$')]"

 concept_frog_toad: "Toad"
 concept_frog_toad_desc: "Toads... Slimy creatures whose sole goal is absolute power. Their attempt to infiltrate every aspect of human life has started $frog_the_conspiracy$ and only their old enemies, the $concept_frog_frogs$ cans stop them."
 concept_frog_toads: "Toads"
 frog_toads_concept: "[Concept('concept_frog_toad', '$concept_frog_toads$')]"

