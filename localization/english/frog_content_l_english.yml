 je_frog_noir_investigating_leads_fail: "[ROOT.GetCountry.GetNameNoFlag] has accumulated #v 5 or greater#! $frog_peril$"
 je_frog_noir_investigating_leads_status: "#v Progress: #green [GetPlayer.MakeScope.Var('frog_investigation_progress_var').GetValue|0]#!/8#!\n#v Progress: #red [GetPlayer.MakeScope.Var('frog_investigation_peril_var').GetValue|0]#!/5#!"

