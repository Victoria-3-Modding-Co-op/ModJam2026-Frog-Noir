l_english:

 frog_narrative_events.1.t: "Frog Noir"
 frog_narrative_events.1.d: "You did not expect a $frog_frogman_concept$ to appear in your office, but [SCOPE.sCharacter('frog_investigator_scope').GetFullName] seems friendly and [SCOPE.sCharacter('frog_investigator_scope').GetSheHe] brings news of a worldwide [concept_frog_conspiracy]..."
 frog_narrative_events.1.f: "\"Ah! You are finally here. We have a lot of work to do!\"\n\n[SCOPE.sCharacter('frog_investigator_scope').GetSheHe|U] took a long breath from his cigarette and delightedly blew out a cloud of smoke.\n\n\"Forget about wars and the economy. Today we face a far greater menace: The Toads. They are trying to infiltrate your governments, your police, your industry... And we are the only once who are able to stop them.\""
 frog_narrative_events.1.g: "Human sized Frogs?! What is this..."

 frog_frogged_by_toads_events.1.t: "Frog like Creatures at Night"
 frog_frogged_by_toads_events.1.d: "The Villagers in a coastal town in [SCOPE.sState('frog_state_scope').GetName] have spotted some frog like shadows in the night. Some even mentioned hearing croaking. But whatever they saw was the size of humans, so it could not possibly be frogs, could it?"
 frog_frogged_by_toads_events.1.f: "\"I went to the pot like every night. Then I saw it! Big shadows lurking at the beach. They looked like huge frogs! And then they started Croaking! Strangely my pet dog disappeared that night too. Can't find him anymore... We're all scared now...\""
 frog_frogged_by_toads_events.1.a: "Leave the Villagers to be Spooked."
 frog_frogged_by_toads_events.1.b: "Our Watchman is on the Case!"

 frog_frogged_by_toads_events.2.t: "Politician Approached by Toadmen"
 frog_frogged_by_toads_events.2.d: "[SCOPE.sCharacter('frog_character_scope').GetFullName] was approached by some well dressed but slimy men. They offered [SCOPE.sCharacter('frog_character_scope').GetHerHim] to make [SCOPE.sCharacter('frog_character_scope').GetHerHim] insanely rich. Hopefully [SCOPE.sCharacter('frog_character_scope').GetSheHe] is righteous enough to not fall to corruption."
 frog_frogged_by_toads_events.2.f: "\"[SCOPE.sCharacter('frog_character_scope').GetCustom('getMsMr')] [SCOPE.sCharacter('frog_character_scope').GetLastNameNoFormatting] we have an irresistible offer for you.\"\n\nThe well-dressed gentleman pulled a hefty package out of his coat pocket. Slime dripped from his hands, but the contents of the package were more than worth the slimy offer."
 frog_frogged_by_toads_events.2.a: "Mmm, I love corruption!"
 frog_frogged_by_toads_events.2.b: "Excuse me! I might be corrupt, but I'm not slimy!"
 frog_frogged_by_toads_events.2.c: "Break the news to the press!"

 frog_frogged_by_toads_events.3.t: "The Lady with the wide smile"
 frog_frogged_by_toads_events.3.d: "A beautiful lady approached [SCOPE.sCharacter('frog_character_scope').GetFullName] at the ball today. Her olive-colored skin and her wide smile immediately captivated [SCOPE.sCharacter('frog_character_scope').GetHerHim]. But would [SCOPE.sCharacter('frog_character_scope').GetSheHe] notice the slimy tracks left by the lady?"
 frog_frogged_by_toads_events.3.f: "\"Oh, what a beautiful face! May I ask you for a dance?\""
 frog_frogged_by_toads_events.3.a: "With a beautiful woman like you? Always."
 frog_frogged_by_toads_events.3.b: "[SCOPE.sCharacter('frog_character_scope').GetCustom('getSirMadam')], that slimey woman is a fraud."

 frog_frogged_by_toads_events.4.t: "Suspicious Company Branding"
 frog_frogged_by_toads_events.4.d: "[SCOPE.sCompany('relevant_company').GetName] changed their branding fundamentally lately. Greenish and brownish colors, toads everywhere. [SCOPE.sCharacter('frog_executive_scope').GetFullName] - the executive - said that he just likes toads, but this seems rather suspicious..."
 frog_frogged_by_toads_events.4.f: "\"By our new toad-themed engines! Cooled with slime, lasting forever!\""
 frog_frogged_by_toads_events.4.a: "Take notes."
 frog_frogged_by_toads_events.4.b: "Question the Executive."
 frog_frogged_by_toads_events.4.c: "Arrest the Executive! The man is a traitor!"

 frog_frogged_by_toads_events.5.t: "Disappearances in [SCOPE.sState('frog_state_scope').GetName]"
 frog_frogged_by_toads_events.5.d: "Despair is spreading in [SCOPE.sState('frog_state_scope').GetName]. More and more people disappear without leaving a trace... Well... actually they leave traces... Slimy Traces..."
 frog_frogged_by_toads_events.5.f: "\"Did you find her? Did you find my husband? He just wanted to buy a pack of cigarettes... He never came back... Now my 11 children will have to grow up without their father! What should I do!?\""
 frog_frogged_by_toads_events.5.a: "We're too late; document evidence."
 frog_frogged_by_toads_events.5.b: "No doubt the toadmen are behind this."
 frog_frogged_by_toads_events.5.c: "I know this mark... it's John Toad."

 frog_investigation_events.1.t: "A Slimy Trace"
 frog_investigation_events.1.d: "Slimy criminals must have been at work in a store in [SCOPE.sState('frog_state_scope').GetCityHubName]. The slimy traces and trails were clear evidence. But what human leaves a slimy trail? Or..."
 frog_investigation_events.1.f: "\"Ew! What is this!?\"\n\nSlime dripped from the investigators shoe. Green. Slimy. Sticky.\n\n\"Where does this slime come from? Do we have criminal snails and slugs now?!\""
 frog_investigation_events.1.a: "Perform a cursory search."
 frog_investigation_events.1.b: "Shut down operations and take detailed notes!"

 frog_investigation_events.2.t: "Vargrants Report Toadmen"
 frog_investigation_events.2.d: "Vagrants in [SCOPE.sState('frog_state_scope').GetName] are telling wild stories about Toadmen lurking in the shadows. Is there any truth to these stories?"
 frog_investigation_events.2.f: "\"I tell you *hic* they were toads! *hic* And they wanted to rob the bank! *hic*\"\n\nThe whiskey bottle slipped from his hand and clattered to the floor.\n\n\"Sir, are you drunk?\"\n\n\"Me?! *hic* Drunk?! *hic* I barely had 3 bottles of beer *hic* and 2 bottles of Whisky... *hic*\""
 frog_investigation_events.2.a: "Hm. Take notes."
 frog_investigation_events.2.b: "Let the Police \"Extract\" more information."

 frog_investigation_events.3.t: "Suspicious Boats Near Port"
 frog_investigation_events.3.d: "Reports from [SCOPE.sState('frog_state_scope').GetName] describe strange boats at our coasts. The suspicions didn't stem from the slime that was all over them - that was fairly normal in these parts of the world - but by the croaking coming from them."
 frog_investigation_events.3.f: "\"Did... Did that boat just croak? It's not a French boat, so why would they transport frogs? And all the slime... Is this some attempt by the French to infiltrate our cuisine?!\""
 frog_investigation_events.3.a: "Why are these boats croaking?"

 frog_investigation_events.4.t: "The Croaking Alleyway"
 frog_investigation_events.4.d: "New reports from [SCOPE.sState('frog_state_scope').GetCityHubName] have arrived and they are... Interesting? Apparently people are disappearing in an alleyway and witnesses recount hearing a lot of croaking..."
 frog_investigation_events.4.f: "\"Yes, I know how this sounds! But the Croaking! There is a worldwide conspiracy by Toadmen to replace us all! I swear! my wife disappeared in this alley a few days back and when she finally returned home her voice was lower and she was... slimy...\""
 frog_investigation_events.4.a: "Rather Noisy for an Alley..."
 frog_investigation_events.4.b: "Ask the police to keep tabs on the croaking."

 frog_investigation_events.5.t: "Pointing Fingers"
 frog_investigation_events.5.d: "It was quite evident that the [SCOPE.gsInterestGroup('disgruntled_ig').GetName] was infiltrated by Toads. Slime and corruption everywhere. But no evidence. Now the question is: Is accusing them publicly worth it?"
 frog_investigation_events.5.f: "\"You are a Toad!\"\n\"No, you are a Toad!\"\n\"No, YOU are a Toad!\"\n\"No, YOU are a Toad!\"\n\"I am quite obviously a Frog and not a Toad...\""
 frog_investigation_events.5.a: "They are slimy, but we have no evidence."
 frog_investigation_events.5.b: "The slime trail is evidence enough. Accuse them!"

 frog_investigation_events.10.t: "An Inconspicuous Tavern"
 frog_investigation_events.10.d: "Nighttime. An old tavern in the middle of nowhere. All the clues lead here. And there he is, a toadman, in the corner, playing poker."
 frog_investigation_events.10.f: "\"A dry Martini. Shaken, not stirred.\"\n\n\"What is a \"Martini\"? We don't have those posh drinks here!\"\n\n\"In that case a beer.\""
 frog_investigation_events.10.a: "Take Notes."
 frog_investigation_events.10.b: "Get the Toad!"